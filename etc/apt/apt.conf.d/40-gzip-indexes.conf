## This file is provided by raspberrypi-sys-mods

## Storing indexes lz4 compressed reduces both their size (~.4 of original),
## and disk i/o when repeatedly reading them into the page cache on heavily
## memory-constrained systems. This has been shown to speed up operations such
## as 'apt list --upgradable' on such systems.

Acquire::GzipIndexes "true";
